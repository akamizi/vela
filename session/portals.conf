# Preferenza dei portali per la sessione Vela (riferimento): cattura e condivisione schermo con wlr, selettore di file e richieste
# di accesso Qt con lxqt, gtk solo come ripiego. Per usarla: copiare in ~/.config/xdg-desktop-portal/sway-portals.conf
# (il nome segue XDG_CURRENT_DESKTOP=sway della sessione) e riavviare xdg-desktop-portal.
[preferred]
default=wlr;lxqt;gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.FileChooser=lxqt
org.freedesktop.impl.portal.Access=lxqt
