# Costruisce il pacchetto xbps a ogni tag v* e lo pubblica come repository xbps su GitHub Pages (ramo gh-pages).
# Segreto richiesto: XBPS_PRIVKEY = contenuto della chiave privata PEM (vedi packaging/void/README.md).
# Pages va attivato una volta: Settings › Pages › Source: ramo gh-pages, cartella /.
name: xbps-repo

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versione da costruire (tag v<versione> esistente); vuoto = file VERSION"
        required: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    # Serve scrivere solo per spingere il ramo gh-pages
    permissions:
      contents: write
    container:
      image: ghcr.io/void-linux/void-glibc-full:latest
    steps:
      - name: Strumenti
        run: |
          xbps-install -Suy xbps
          xbps-install -uy
          xbps-install -y git curl openssl base-devel cargo bash

      # Con l'avvio a mano si costruisce il tag v<versione>, non il ramo main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.inputs.version && format('v{0}', github.event.inputs.version) || github.ref }}

      # xbps-src non funziona qui (niente user namespace nel container dei runner): si impacchetta con xbps-create
      - name: Pacchetto
        run: sh scripts/build-xbps-direct.sh "$GITHUB_WORKSPACE/out"

      - name: Repository firmato
        env:
          XBPS_PRIVKEY: ${{ secrets.XBPS_PRIVKEY }}
        run: |
          [ -n "$XBPS_PRIVKEY" ] || { echo "segreto XBPS_PRIVKEY mancante" >&2; exit 1; }
          umask 077; printf '%s\n' "$XBPS_PRIVKEY" > "$RUNNER_TEMP/key.pem"
          sh scripts/publish-xbps-repo.sh out site/current "$RUNNER_TEMP/key.pem" "Maurizio Cavalletti"
          rm -f "$RUNNER_TEMP/key.pem"
          touch site/.nojekyll

      - name: Pubblica su gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add -A; git commit -qm "Repository xbps ${GITHUB_REF_NAME:-manuale}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" gh-pages
