# Esegue i test del progetto (`make test`: librerie JS della shell, script di avvio, demone e helper in Rust) a ogni push su main
# e a ogni pull request. Prima i test giravano solo a mano.
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test
        run: make test
